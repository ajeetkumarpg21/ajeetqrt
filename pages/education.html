function gradeColor(g) {
  if (!g) return 'var(--muted)';
  if (g.includes('★') || g === 'Excellent') return 'var(--accent)';
  if (g === 'A+' || g === 'A') return 'var(--accent)';
  if (g.includes('Proficient') || g === 'B+' || g === 'B' || g === 'E') return 'var(--accent2)';
  return 'var(--muted)';
}

function transcriptTable(headers, rows, colCount) {
  return `
  <div style="overflow-x:auto;margin-top:16px">
    <table class="t-table">
      <thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
      <tbody>
        ${rows.map(r=>`<tr>${r.map((c,i)=>`<td style="color:${(i===r.length-1&&colCount>4)?gradeColor(c):'var(--muted)'}">${c}</td>`).join('')}</tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}
