<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>404 — Ajeet Kumar Portfolio</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@700;800&display=swap"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#020408;color:#e8f0fe;font-family:'IBM Plex Mono',monospace;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;}
    h1{font-family:'Syne',sans-serif;font-size:clamp(5rem,15vw,10rem);font-weight:800;color:#00d4ff;line-height:1;text-shadow:0 0 40px rgba(0,212,255,0.4);}
    p{color:#8899b0;margin:1rem 0 2rem;font-size:0.9rem;}
    a{display:inline-block;padding:10px 28px;background:#00d4ff;color:#020408;border-radius:6px;text-decoration:none;font-weight:600;font-size:0.85rem;transition:all .2s;}
    a:hover{background:#00aacc;transform:translateY(-2px);}
    .sub{font-size:1.2rem;color:#e8f0fe;margin-bottom:0.5rem;}
  </style>
</head>
<body>
  <div>
    <h1>404</h1>

</html>
